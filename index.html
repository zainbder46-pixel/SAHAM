<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASAHAM OS — نظام إدارة قناة مع سهم</title>
<style>
:root{--bg:#0d0d0d;--card:#181818;--line:#2c2c2c;--tx:#f3efe4;--mu:#9a9482;--gold:#d4af37;--red:#e5594f;--grn:#4caf7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ea;--card:#fff;--line:#e2dccb;--tx:#1a1a1a;--mu:#6d675a;--gold:#9a7a12}}
:root[data-theme="light"]{--bg:#f6f3ea;--card:#fff;--line:#e2dccb;--tx:#1a1a1a;--mu:#6d675a;--gold:#9a7a12}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header b{color:var(--gold);font-size:18px;letter-spacing:1px}header span{color:var(--mu);font-size:12px;flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button.on,button.pri{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
button.dng{color:var(--red)}
main{padding:6px 16px 40px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:26px;color:var(--gold)}.kpi.bad b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500;font-size:13px}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.col{min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.col h4{margin:4px 4px 8px;color:var(--gold);font-size:13px}
.it{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:pointer}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}
.tag.late{color:var(--red);border-color:var(--red)}
.pg{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--gold)}
.empty{text-align:center;color:var(--mu);padding:30px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--gold);border-radius:14px;width:min(520px,94vw);padding:16px}
dialog::backdrop{background:#000a}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:8px 18px;border-radius:99px;display:none;z-index:9}
</style>
</head>
<body>
<header><b>MASAHAM OS</b><span>نظام تشغيل وإدارة قناة مع سهم</span><button id="th">◐</button></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">جاري التحميل…</div></main>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:min(380px,100%);padding:20px">
    <h2 style="color:var(--gold);margin:0 0 4px">MASAHAM OS</h2>
    <div style="color:var(--mu);margin-bottom:12px">تسجيل الدخول إلى نظام قناة مع سهم</div>
    <label>البريد الإلكتروني</label>
    <input id="lem" type="email" autocomplete="username" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px">

    <input id="lpw" type="password" autocomplete="current-password" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lmsg" style="color:var(--red);min-height:20px;margin-top:8px"></div>
    <button class="pri" style="width:100%" onclick="doLogin()">دخول</button>
    <div style="color:var(--mu);font-size:12px;margin-top:10px">الحسابات يضيفها مدير النظام فقط. نسيت كلمة المرور؟ اطلبها من المدير.</div>
  </div>
</div>

<script>
const SB_URL="https://afmmjxoemrvgdagxvmrj.supabase.co",SB_KEY="sb_publishable_wqXAovzuEhq8JTYt5l1BqA_MaPM6-ew";
const sb=supabase.createClient(SB_URL,SB_KEY);let SES=null,ADMIN=false;
const READY=new Promise(r=>{window.__r=r});
async function afterLogin(s){SES=s;const{data}=await sb.from("admins").select("user_id").eq("user_id",s.user.id);ADMIN=!!(data&&data.length);document.getElementById("login").style.display="none";document.querySelector("header").insertAdjacentHTML("beforeend",'<button onclick="doLogout()">خروج</button>');window.__r()}
sb.auth.getSession().then(({data})=>{if(data.session)afterLogin(data.session);else document.getElementById("login").style.display="flex"});
async function doLogin(){const m=document.getElementById("lmsg");m.textContent="";const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById("lem").value.trim(),password:document.getElementById("lpw").value});if(error){m.textContent="البريد أو كلمة المرور غير صحيحة";return}afterLogin(data.session)}
function doLogout(){sb.auth.signOut().then(()=>location.reload())}
const REF=(col,id)=>({id,set:async o=>{const{error}=await sb.from("docs").upsert({col,id,data:o});if(error)throw error},update:async o=>{const{data}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();const{error}=await sb.from("docs").upsert({col,id,data:{...(data?data.data:{}),...o}});if(error)throw error},delete:async()=>{const{error}=await sb.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error}});
const DBX={doc:p=>{const[c,i]=p.split("/");return REF(c,i)},collection:c=>({doc:i=>REF(c,i||crypto.randomUUID()),onSnapshot(cb,eb){const load=async()=>{const{data,error}=await sb.from("docs").select("id,data").eq("col",c);if(error){eb&&eb(error);return}cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})};load();sb.channel("c-"+c+Math.random()).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"col=eq."+c},load).subscribe()}})};
window.claude={use:async n=>{await READY;if(n==="db")return DBX;if(n==="user")return{id:async()=>SES.user.id,profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:(SES.user.user_metadata&&SES.user.user_metadata.name)||SES.user.email.split("@")[0]}])),canEdit:()=>ADMIN,isOwner:()=>ADMIN,can:()=>null};return null}};

<script>
const EP=["فكرة جديدة","قيد التقييم","بانتظار الاعتماد","معتمدة","قيد الإعداد","جاهزة للتصوير","تم التصوير","قيد المونتاج","مراجعة أولى","تعديلات مطلوبة","مراجعة نهائية","معتمدة للنشر","مجدولة","منشورة","مؤرشفة","ملغاة"];
const TK=["جديدة","مسندة","قيد التنفيذ","بانتظار طرف آخر","تحتاج مراجعة","تحتاج تعديلات","مكتملة","ملغاة"];
const GS=["مرشح","قيد البحث","لم يتم التواصل","تم التواصل","بانتظار الرد","مهتم","تمت الموافقة","اعتذر","مؤكد","تم التسجيل","مؤجل"];
const PR=["عاجلة","عالية","متوسطة","منخفضة"];
const S={tab:"home",ep:[],tk:[],gs:[],qa:[],mem:[],rl:[],roles:{},me:"",cur:"",et:"ov",sh:[],sg:[],vs:"",q:"",f:"",db:null,user:null,canDel:false,canWrite:true};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const done=t=>t.status==="مكتملة"||t.status==="ملغاة";
const late=t=>t.due&&t.due<today()&&!done(t);
const prog=e=>{const i=EP.indexOf(e.status);return e.status==="ملغاة"?0:Math.round(Math.min(i,13)/13*100)};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
const th=localStorage;
try{const v=th.getItem("mth");if(v)document.documentElement.dataset.theme=v}catch(e){}
$("th").onclick=()=>{const d=document.documentElement;const n=(d.dataset.theme==="light"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme: light)").matches))?"dark":"light";d.dataset.theme=n;try{th.setItem("mth",n)}catch(e){}};

const ALL=[["home","لوحة التحكم"],["my","مهامي"],["qa","الأسئلة والأجوبة"],["ref","المرجع و VAR"],["ep","الحلقات"],["tk","كل المهام"],["gs","الضيوف"],["tm","الفريق والصلاحيات"]];
const QS=["مفتوح","تمت الإجابة","معتمد"];
const ROLES={admin:["مدير النظام","home my qa ep tk gs tm"],manager:["مدير القناة","home my qa ep tk gs"],producer:["منتج","home my qa ep tk gs"],researcher:["باحث","home my qa ep tk"],guestco:["منسق ضيوف","home my qa gs tk"],crew:["مصور / مونتير","home my qa ep tk"],member:["عضو فريق","home my qa"]};
const role=()=>S.canDel?"admin":(S.roles[S.me]&&ROLES[S.roles[S.me]]?S.roles[S.me]:"member");
const can=t=>t==="ref"||ROLES[role()][1].split(" ").includes(t);
function nav(){$("nav").innerHTML=ALL.filter(([k])=>can(k)).map(([k,v])=>`<button class="${S.tab===k?"on":""}" data-k="${k}">${v}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;S.q="";S.f="";S.cur="";render()})}

const FORMS={
 ep:{col:"episodes",title:"حلقة",st:EP,f:[["title","عنوان الحلقة","text"],["topic","الموضوع الرئيسي","text"],["host","المقدم","text"],["guest","الضيف","text"],["researcher","الباحث","text"],["shoot","تاريخ التصوير","date"],["publish","تاريخ النشر المستهدف","date"],["pub_url","رابط النشر","text"],["notes","ملاحظات","area"]]},
 tk:{col:"tasks",title:"مهمة",st:TK,f:[["title","اسم المهمة","text"],["assigneeId","المسؤول","mem"],["epId","الحلقة المرتبطة","epsel"],["due","تاريخ الاستحقاق","date"],["prio","الأولوية","sel",PR],["notes","الوصف","area"]]},
 gs:{col:"guests",title:"ضيف",st:GS,f:[["name","الاسم","text"],["job","المسمى والجهة","text"],["field","التخصص","text"],["phone","رقم التواصل","text"],["email","البريد","text"],["owner","مسؤول التواصل","text"],["epId","الحلقة","epsel"],["follow","موعد المتابعة","date"],["notes","ملاحظات داخلية","area"]]},
 qa:{col:"qa",title:"سؤال",st:QS,f:[["q","السؤال","area"],["a","الإجابة","area"],["to","موجّه إلى","mem"],["tag","الوسم / الموضوع","text"],["epId","الحلقة المرتبطة","epsel"],["segId","الفقرة","segsel"],["bank","بنك الإجابات (إجابة بكل سطر، والمصدر بعد علامة |)","area"],["src","المصدر","text"],["verdict","الحكم (VAR)","sel",["غير مؤكد","صح","غلط"]]]},
 sh:{col:"shoots",title:"جلسة تصوير",st:["مجدولة","تمت","مؤجلة"],f:[["date","التاريخ","date"],["time","الوقت","text"],["loc","الموقع","text"],["epId","الحلقة","epsel"],["crew","الفريق والمشاركون","text"],["gear","المعدات (سطر لكل عنصر)","area"],["run","ترتيب الفقرات (سطر لكل فقرة)","area"],["notes","ملاحظات المخرج","area"]]},
 sg:{col:"segs",title:"فقرة",st:["قيد الإعداد","جاهزة","تم تصويرها"],f:[["title","عنوان الفقرة","text"],["epId","الحلقة","epsel"],["ord","الترتيب (رقم)","text"],["dur","المدة بالدقائق","text"],["notes","ملاحظات الفقرة","area"]]}
};
function nm(id) {
  const member = (S.mem || []).find(m => m.id === id);
  return member ? member.name : "";
}
function openForm(k,rec,pre){
 const F=FORMS[k],r=rec||pre||{};
 const inp=([n,l,t,o])=>`<label>${l}</label>`+(t==="area"?`<textarea name="${n}" rows="3">${esc(r[n])}</textarea>`:t==="segsel"?`<select name="${n}"><option value="">—</option>${S.sg.filter(s=>!r.epId||s.epId===r.epId).map(m=>`<option value="${m.id}" ${r[n]===m.id?"selected":""}>${esc(m.title)}</option>`).join("")}</select>`:t==="epsel"?`<select name="${n}"><option value="">—</option>${S.ep.map(m=>`<option value="${m.id}" ${r[n]===m.id?"selected":""}>${esc(m.title)}</option>`).join("")}</select>`:t==="mem"?`<select name="${n}"><option value="">—</option>${S.mem.map(m=>`<option value="${m.id}" ${r[n]===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`:t==="sel"?`<select name="${n}">${o.map(x=>`<option ${r[n]===x?"selected":""}>${x}</option>`).join("")}</select>`:`<input name="${n}" type="${t}" value="${esc(r[n])}">`);
 const log=k==="gs"&&rec?`<label>سجل التواصل</label>${(r.log||[]).map(x=>`<div class="card">${esc(x.d)} —${esc(x.t)}</div>`).join("")||'<div class="tag">لا يوجد</div>'}<input id="nl" placeholder="أضف محاولة تواصل (الطريقة والنتيجة)">`:"";
 // هنا تم إصلاح الخطأ (r.status || F.st[0])
$("dlg").innerHTML=`<form method="dialog" id="fm"><h3>${rec?"تعديل":"إضافة"} ${F.title}</h3>${F.f.map(inp).join("")}<label>الحالة</label><select name="status">${F.st.map(x=>`<option ${(r.status || F.st[0])===x?"selected":""}>${x}</option>`).join("")}</select>${log}<div class="bar" style="margin-top:14px"><button class="pri" value="ok">حفظ</button><button value="x">إلغاء</button>${rec&&S.canDel?`<button type="button" class="dng" id="dl">حذف</button>`:""}</div></form>`;
  const d=$("dlg");d.showModal();
 if(k==="qa"&&rec){const b=document.createElement("button");b.type="button";b.textContent="حوّل لمهمة";b.onclick=async()=>{await S.db.collection("tasks").doc().set({title:rec.q.slice(0,80),assigneeId:rec.to||"",assignee:nm(rec.to),status:"جديدة",notes:"من سؤال: "+rec.q,prio:"متوسطة",created:Date.now(),updated:Date.now(),by:S.me});d.close();toast("تم إنشاء المهمة")};$("fm").querySelector(".bar").append(b)}
 $("fm").onsubmit=async e=>{
  if(e.submitter?.value!=="ok")return;
  const fd=Object.fromEntries(new FormData($("fm")));const main=F.f[0][0];
  if(!fd[main].trim()){e.preventDefault();toast("الحقل الأول مطلوب");return}
  if(k==="qa"&&!rec&&S.qa.some(x=>sim(x.q,fd.q)>=0.8)&&!confirm("يوجد سؤال مشابه جدًا محفوظ من قبل. تضيفه مع ذلك؟")){e.preventDefault();return}
  if(k==="ep"&&fd.status==="منشورة"&&(!fd.pub_url||!fd.publish)&&!S.canDel){e.preventDefault();toast("أدخل رابط وتاريخ النشر أولًا");return}
  const log=r.log||[];if($("nl")&&$("nl").value.trim())log.push({d:today(),t:$("nl").value.trim()});
  const data={...r,...fd,log,updated:Date.now()};if(!rec){data.created=Date.now();data.by=S.me}if(k==="tk")data.assignee=nm(fd.assigneeId);
  try{const ref=rec?S.db.doc(F.col+"/"+rec.id):S.db.collection(F.col).doc();const o={...data};delete o.id;await ref.set(o);toast("تم الحفظ")}catch(x){toast("تعذر الحفظ: ليس لديك صلاحية الكتابة")}
 };
 if($("dl"))$("dl").onclick=async()=>{if(confirm("تأكيد الحذف النهائي؟")){await S.db.doc(F.col+"/"+rec.id).delete();d.close();toast("تم الحذف")}};
}

function bar(k,ss){return `<div class="bar"><input id="q" placeholder="بحث…" value="${esc(S.q)}"><select id="f"><option value="">كل الحالات</option>${ss.map(x=>`<option ${S.f===x?"selected":""}>${x}</option>`).join("")}</select>${S.canWrite?`<button class="pri" id="add">+ إضافة</button>`:""}</div>`}
function bind(k){const q=$("q");q.oninput=()=>{S.q=q.value;render(true)};$("f").onchange=e=>{S.f=e.target.value;render()};if($("add"))$("add").onclick=()=>openForm(k);document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>k==="ep"?(S.cur=el.dataset.id,S.et="ov",render()):openForm(k,S[k].find(x=>x.id===el.dataset.id)))}
const flt=(a,keys)=>a.filter(x=>(!S.f||x.status===S.f)&&(!S.q||keys.some(c=>norm(x[c]).includes(norm(S.q)))));

function home(){
 const t=S.tk,e=S.ep,open=t.filter(x=>!done(x)),w=Date.now()-7*864e5;
 const cnt=l=>e.filter(x=>l.includes(x.status)).length;
 const kp=[["حلقات قيد الإعداد",cnt(["قيد الإعداد","جاهزة للتصوير","معتمدة"])],["قيد الإنتاج",cnt(["تم التصوير","قيد المونتاج","مراجعة أولى","تعديلات مطلوبة","مراجعة نهائية"])],["جاهزة للنشر",cnt(["معتمدة للنشر","مجدولة"])],["مهام مفتوحة",open.length],["مهام متأخرة",t.filter(late).length,1],["مستحقة اليوم",open.filter(x=>x.due===today()).length],["أُنجزت هذا الأسبوع",t.filter(x=>x.status==="مكتملة"&&x.updated>w).length],["ضيوف بانتظار الرد",S.gs.filter(g=>["بانتظار الرد","تم التواصل"].includes(g.status)).length],["أسئلة بلا إجابة",S.qa.filter(q=>q.status==="مفتوح").length]];
 const by={};open.forEach(x=>{const n=x.assignee||"غير مسند";by[n]=(by[n]||0)+1});
 const fol=S.gs.filter(g=>g.follow&&g.follow<=today()&&!["تم التسجيل","اعتذر"].includes(g.status));
 const up=S.sh.filter(x=>x.date>=today()&&x.status!=="تمت").sort((a,b)=>a.date>b.date?1:-1).slice(0,5).map(x=>({shoot:x.date+" "+(x.time||""),title:(S.ep.find(p=>p.id===x.epId)||{}).title||x.loc||""}));
 const avg=e.length?Math.round(e.reduce((s,x)=>s+prog(x),0)/e.length):0;
 return `<div class="grid">${kp.map(([l,v,b])=>`<div class="kpi ${b&&v?"bad":""}">${l}<b>${v}</b></div>`).join("")}</div>
 <div class="card">نسبة إنجاز خطة الإنتاج: ${avg}%<div class="pg"><i style="width:${avg}%"></i></div></div>
 <div class="card"><b>توزيع المهام المفتوحة</b><br>${Object.entries(by).map(([n,v])=>`<span class="tag">${esc(n)}:${v}</span> `).join("")||"لا توجد مهام مفتوحة"}</div>
 <div class="card"><b>تصوير قادم</b>${up.map(x=>`<div>${esc(x.shoot)} —${esc(x.title)}</div>`).join("")||'<div class="tag">لا يوجد</div>'}</div>
